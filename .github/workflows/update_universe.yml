name: Monthly Universe & IPO Updater

on:
  schedule:
    # Runs at 8:00 PM IST (14:30 UTC) on the 1st of every month
    - cron: '30 14 1 * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_universe_update]

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance gspread google-auth pandas numpy

      - name: Run Universe Updater
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python update_universe.py
