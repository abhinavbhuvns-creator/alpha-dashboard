name: Monthly Master Update

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 UTC) on the 1st day of every month
    - cron: '30 4 1 * *'
  workflow_dispatch: 

jobs:
  run-monthly-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install yfinance gspread google-auth pandas numpy

      - name: Run Master Database Updater
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python master_updater.py
