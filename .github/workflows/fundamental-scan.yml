name: Saturday Fundamental GARP Scan

# Runs automatically at 6:30 PM IST every Saturday
on:
  schedule:
    - cron: '10 13 * * 6' # 13:10 UTC is 6:40 PM IST on Saturday (6 = Saturday)
  workflow_dispatch: # Allows you to click "Run workflow" manually to test it

jobs:
  fundamental-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance gspread google-auth

    - name: Run Fundamental Scan Script
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        python fundamental_scan.py
