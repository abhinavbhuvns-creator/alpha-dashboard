name: Weekly Fundamental Updates

on:
  schedule:
    # Runs at 10:00 AM IST (04:30 UTC) every Saturday
    - cron: '30 4 * * 6'
  workflow_dispatch:

jobs:
  update-fundamentals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas gspread google-auth yfinance numpy

      - name: Run Fundamentals Tracker
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python fundamentals_tracker.py
