name: Alpha Dashboard Daily Run

on:
  workflow_dispatch: 
    inputs:
      session:
        description: 'Morning or Afternoon run?'
        required: true
        default: 'afternoon'

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: pip install yfinance yahooquery gspread google-auth pandas numpy

      - name: 1. Run Daily Technicals (Both Morning and Afternoon)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py

      - name: 2. Run ETF Database Engine (Both Morning and Afternoon)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python etf_database_updater.py

      - name: 3. Run Master Scanner (AFTERNOON ONLY)
        if: github.event.inputs.session == 'afternoon'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python master_scanner.py

      - name: 4. Run Watchlist Builder (AFTERNOON ONLY)
        if: github.event.inputs.session == 'afternoon'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python watchlist_builder.py
