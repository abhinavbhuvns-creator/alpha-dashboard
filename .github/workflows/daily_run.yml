name: Alpha Dashboard Daily Run

on:
  schedule:
    # 1. Runs at 3:50 UTC (9:20 AM IST) - Monday through Friday
    - cron: '50 3 * * 1-5'
    # 2. Runs at 10:30 UTC (4:00 PM IST) - Monday through Friday
    - cron: '30 10 * * 1-5'
  
  workflow_dispatch: 

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: |
          pip install yfinance gspread google-auth pandas numpy

      - name: Run Daily Technicals (Runs at 9:20 AM and 4:00 PM)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py

      - name: Run Master Scanner (Runs ONLY at 4:00 PM or Manual Play)
        if: github.event.schedule == '30 10 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python master_scanner.py

      - name: Run Watchlist Builder (Runs ONLY at 4:00 PM or Manual Play)
        if: github.event.schedule == '30 10 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python watchlist_builder.py
