name: Alpha Dashboard Daily Run

on:
  schedule:
    # 1. Runs at 3:50 UTC (9:20 AM IST) - Monday through Friday
    - cron: '50 3 * * 1-5'
    # 2. Runs at 10:30 UTC (4:00 PM IST) - Monday through Friday
    - cron: '30 10 * * 1-5'
  
  # This line adds a manual "Play" button so you can test it immediately
  workflow_dispatch: 

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: |
          pip install yfinance gspread google-auth pandas numpy

      - name: Run Main Dashboard Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py
