name: Daily Corporate Announcements

on:
  schedule:
    # Runs at 6:30 PM IST (13:00 UTC) Monday through Friday
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas gspread google-auth

      - name: Run Announcement Tracker
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python corporate_tracker.py
